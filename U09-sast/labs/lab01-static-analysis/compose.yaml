services:
  lab:
    build: .
    image: software-security-static:local
    user: "${LAB_UID:?Définir LAB_UID}:${LAB_GID:?Définir LAB_GID}"
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ./:/workspace
    network_mode: none
    security_opt:
      - no-new-privileges:true
    # Pour GDB si necessaire, utiliser ponctuellement:
    # security_opt: [seccomp:unconfined, no-new-privileges:true]

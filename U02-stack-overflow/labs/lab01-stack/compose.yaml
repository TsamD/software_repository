services:
  lab:
    build: .
    image: software-security-lab:latest
    user: "${LAB_UID:?Définir LAB_UID}:${LAB_GID:?Définir LAB_GID}"
    environment:
      HOME: /tmp
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ./:/workspace
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_PTRACE
